
<!DOCTYPE html>
<html>
<head>
    <title>Hand Sign Recognition</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        #video-container {
            margin: 20px 0;
            position: relative;
        }
        #video-feed {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
        }
        #text-display {
            font-size: 48px;
            margin: 20px 0;
            min-height: 60px;
            font-weight: bold;
        }
        #text-history {
            font-size: 24px;
            margin: 20px 0;
            min-height: 100px;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .button:hover {
            background-color: #45a049;
        }
        #clear-btn {
            background-color: #f44336;
        }
        #clear-btn:hover {
            background-color: #d32f2f;
        }
        #status {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hand Sign Recognition</h1>
        
        <div id="video-container">
            <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
        </div>
        
        <div id="text-display">{{ recognized_text }}</div>
        
        <div>
            <p>History:</p>
            <div id="text-history"></div>
        </div>
        
        <div>
            <button id="space-btn" class="button">Space</button>
            <button id="backspace-btn" class="button">Backspace</button>
            <button id="clear-btn" class="button">Clear</button>
            <button id="save-btn" class="button">Save</button>
            <button id="train-btn" class="button" style="background-color: #2196F3;">Train Dataset</button>
        </div>
        
        <div id="training-ui" style="display: none;">
            <h2>Training Mode</h2>
            <p>Current Letter: <span id="current-letter">A</span></p>
            <p>Samples Collected: <span id="samples-count">0</span></p>
            <div id="training-progress">
                <div id="progress-bar" style="width: 0%; height: 20px; background-color: #4CAF50;"></div>
            </div>
            <button id="capture-btn" class="button">Capture Sample</button>
            <button id="next-letter-btn" class="button">Next Letter</button>
            <button id="stop-training-btn" class="button" style="background-color: #f44336;">Stop Training</button>
        </div>
        
        <p id="status">Waiting for connection...</p>
    </div>

    <script>
        // Connect to Socket.IO server
        const socket = io();
        let textHistory = '';
        const textDisplay = document.getElementById('text-display');
        const textHistory_el = document.getElementById('text-history');
        const statusEl = document.getElementById('status');
        
        // Connection events
        socket.on('connect', function() {
            statusEl.textContent = 'Connected';
        });
        
        socket.on('disconnect', function() {
            statusEl.textContent = 'Disconnected';
        });
        
        socket.on('connection_response', function(data) {
            statusEl.textContent = data.status;
        });
        
        // Button handlers
        document.getElementById('space-btn').addEventListener('click', function() {
            addToHistory(' ');
        });
        
        document.getElementById('backspace-btn').addEventListener('click', function() {
            if (textHistory.length > 0) {
                textHistory = textHistory.slice(0, -1);
                textHistory_el.textContent = textHistory;
            }
        });
        
        document.getElementById('clear-btn').addEventListener('click', function() {
            textHistory = '';
            textHistory_el.textContent = textHistory;
        });
        
        document.getElementById('save-btn').addEventListener('click', function() {
            saveText(textHistory);
        });
        
        // Add text to history
        function addToHistory(text) {
            if (text) {
                textHistory += text;
                textHistory_el.textContent = textHistory;
            }
        }
        
        // Save text to server
        function saveText(text) {
            fetch('/save_and_exit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: text }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Text saved successfully!');
                    window.location.href = '/exit';
                } else {
                    alert('Error saving text: ' + data.message);
                }
            })
            .catch(error => {
                alert('Error: ' + error);
            });
        }
        
        // Letter recognition variables
        let lastLetter = '';
        let lastAddedLetter = '';
        let letterHeldCount = 0;
        let steadyStateReached = false;
        const LETTER_HOLD_THRESHOLD = 10; // Number of consecutive same letter recognitions
        const STEADY_STATE_COOLDOWN = 2000; // 2 seconds before accepting same letter again
        let lastLetterTime = 0;
        
        // Listen for letter updates from server
        socket.on('text_update', function(data) {
            const currentTime = Date.now();
            const letterFromServer = data.text;
            
            // Update the display with the current recognized letter
            if (letterFromServer) {
                textDisplay.textContent = letterFromServer;
                
                // Logic for determining when to add a letter to history
                if (letterFromServer === lastLetter) {
                    // Same letter detected
                    letterHeldCount++;
                    
                    // If we reach threshold and haven't added this letter yet
                    if (letterHeldCount >= LETTER_HOLD_THRESHOLD && !steadyStateReached) {
                        addToHistory(letterFromServer);
                        lastAddedLetter = letterFromServer;
                        steadyStateReached = true;
                        lastLetterTime = currentTime;
                    }
                } else {
                    // New letter detected, reset counters
                    lastLetter = letterFromServer;
                    letterHeldCount = 1;
                    steadyStateReached = false;
                }
            }
            
            // Reset steady state after cooldown to allow same letter again
            if (steadyStateReached && (currentTime - lastLetterTime > STEADY_STATE_COOLDOWN)) {
                steadyStateReached = false;
            }
        });
        
        // Add training mode variables and handlers
        let isTrainingMode = false;
        let currentLetterIndex = 0;
        let samplesCollected = 0;
        const SAMPLES_PER_LETTER = 10;
        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        
        // Training mode button handler
        document.getElementById('train-btn').addEventListener('click', function() {
            isTrainingMode = true;
            document.getElementById('training-ui').style.display = 'block';
            document.getElementById('train-btn').style.display = 'none';
            socket.emit('start_training');
        });
        
        // Stop training button handler
        document.getElementById('stop-training-btn').addEventListener('click', function() {
            isTrainingMode = false;
            document.getElementById('training-ui').style.display = 'none';
            document.getElementById('train-btn').style.display = 'block';
            socket.emit('stop_training');
        });
        
        // Capture sample button handler
        document.getElementById('capture-btn').addEventListener('click', function() {
            if (isTrainingMode) {
                socket.emit('capture_sample', { letter: letters[currentLetterIndex] });
            }
        });
        
        // Next letter button handler
        document.getElementById('next-letter-btn').addEventListener('click', function() {
            if (isTrainingMode) {
                currentLetterIndex = (currentLetterIndex + 1) % letters.length;
                samplesCollected = 0;
                updateTrainingUI();
            }
        });
        
        // Update training UI
        function updateTrainingUI() {
            document.getElementById('current-letter').textContent = letters[currentLetterIndex];
            document.getElementById('samples-count').textContent = samplesCollected;
            const progress = (samplesCollected / SAMPLES_PER_LETTER) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }
        
        // Listen for training updates from server
        socket.on('training_update', function(data) {
            if (data.success) {
                samplesCollected++;
                updateTrainingUI();
                if (samplesCollected >= SAMPLES_PER_LETTER) {
                    currentLetterIndex = (currentLetterIndex + 1) % letters.length;
                    samplesCollected = 0;
                    updateTrainingUI();
                }
            }
        });
    </script>
</body>
</html>
