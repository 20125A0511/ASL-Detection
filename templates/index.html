<!DOCTYPE html>
<html>
<head>
    <title>Automated AI-Based Sign Language Translator</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
        }
        #video-container {
            margin: 20px 0;
            position: relative;
        }
        #video-feed {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
        }
        #text-display {
            font-size: 48px;
            margin: 20px 0;
            min-height: 60px;
            font-weight: bold;
        }
        #text-history {
            font-size: 24px;
            margin: 20px 0;
            min-height: 100px;
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .button:hover {
            background-color: #45a049;
        }
        #clear-btn {
            background-color: #f44336;
        }
        #clear-btn:hover {
            background-color: #d32f2f;
        }
        #status {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Automated AI-Based Sign Language Translator</h1>
        
        <div id="video-container">
            <img id="video-feed" src="{{ url_for('video_feed') }}" alt="Video Feed">
        </div>
        
        <div id="text-display">{{ recognized_text }}</div>
        
        <div>
            <p>History:</p>
            <div id="text-history"></div>
        </div>
        
        <div>
            <button id="space-btn" class="button">Space</button>
            <button id="backspace-btn" class="button">Backspace</button>
            <button id="clear-btn" class="button">Clear</button>
            <button id="save-btn" class="button">Save</button>
        </div>
        
        <p id="status">Waiting for connection...</p>
    </div>

    <script>
        // Connect to Socket.IO server
        const socket = io();
        let textHistory = '';
        const textDisplay = document.getElementById('text-display');
        const textHistory_el = document.getElementById('text-history');
        const statusEl = document.getElementById('status');
        
        // Connection events
        socket.on('connect', function() {
            statusEl.textContent = 'Connected';
        });
        
        socket.on('disconnect', function() {
            statusEl.textContent = 'Disconnected';
        });
        
        // Handle recognized text updates
        socket.on('text_update', function(data) {
            textDisplay.textContent = data.text;
            if (data.text) {
                textHistory += data.text;
                textHistory_el.textContent = textHistory;
            }
        });
        
        // Button event listeners
        document.getElementById('space-btn').addEventListener('click', function() {
            textHistory += ' ';
            textHistory_el.textContent = textHistory;
        });
        
        document.getElementById('backspace-btn').addEventListener('click', function() {
            textHistory = textHistory.slice(0, -1);
            textHistory_el.textContent = textHistory;
        });
        
        document.getElementById('clear-btn').addEventListener('click', function() {
            textHistory = '';
            textHistory_el.textContent = textHistory;
        });
        
        document.getElementById('save-btn').addEventListener('click', function() {
            if (textHistory) {
                fetch('/save_and_exit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({text: textHistory}),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        window.location.href = '/exit';
                    }
                });
            }
        });
    </script>
</body>
</html>
